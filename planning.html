<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1b1e24">
<title>Планирование · Трекер</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #1b1e24; --panel: #22262e; --card-bg: #282d36; --surface-2: #1e2229;
    --line: #33383f; --text: #dcdcd6; --muted: #8a8f98; --accent: #d68a2b;
    --done: #4f9d69; --progress: #3f7fbf; --paused: #8a8f98; --blocked: #c25b52; --notstarted: #6b7078;
  }
  html.light {
    --bg: #f4f2ee; --panel: #ffffff; --card-bg: #ffffff; --surface-2: #ece8e0;
    --line: #ddd8ce; --text: #2a2a28; --muted: #726d63; --accent: #b9701f;
    --done: #3f8f5c; --progress: #2f6fae; --paused: #8a8478; --blocked: #b84a42; --notstarted: #9a9488;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 80px; }
  select, input, button, textarea {
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 9px 10px; font-size: 14px; font-family: inherit;
  }
  button { background: var(--accent); color: #1b1e24; border: none; font-weight: 600; cursor: pointer; }
  button.secondary { background: transparent; border: 1px solid var(--line); color: var(--text); font-weight: 400; }
  button.small { padding: 5px 9px; font-size: 12px; }

  header { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .header-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; color: var(--accent); }
  a.back { color: var(--muted); text-decoration: none; font-size: 12px; }
  .week-nav { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .week-nav button { font-size: 12px; padding: 6px 10px; }
  #weekLabel { font-size: 12px; color: var(--muted); }

  .tabs { display: flex; overflow-x: auto; gap: 6px; padding: 10px 14px 0; -webkit-overflow-scrolling: touch; scrollbar-width: none; -ms-overflow-style: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex-shrink: 0; padding: 7px 12px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); font-size: 12px; color: var(--muted); white-space: nowrap; cursor: pointer; }
  .tab.active { background: var(--accent); color: #1b1e24; border-color: var(--accent); font-weight: 600; }
  .tab.today { border-color: var(--accent); }
  .tab .count { opacity: 0.75; margin-left: 4px; }

  main { padding: 14px; }
  .card { background: var(--card-bg); border: 1px solid var(--line); border-left: 3px solid var(--notstarted); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
  .card-head { display: flex; justify-content: space-between; align-items: center; padding: 5px 12px; font-size: 10px; font-weight: 700; color: #1b1e24; }
  .card-body { padding: 10px 12px 12px; }
  .card-body .task-title { font-size: 14.5px; line-height: 1.4; margin-bottom: 8px; }
  .card-body .meta { display: flex; flex-wrap: wrap; gap: 5px; font-size: 11px; }
  .tag { padding: 2px 8px; border-radius: 5px; color: #1b1e24; font-weight: 600; }
  .empty-note { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }

  .fab { position: fixed; right: 18px; bottom: 22px; width: 56px; height: 56px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.4); z-index: 5; }

  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); align-items: flex-end; justify-content: center; z-index: 20; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--panel); border-radius: 16px 16px 0 0; padding: 18px 16px 24px; width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto; }
  .modal h2 { margin: 0 0 14px; font-size: 16px; color: var(--accent); }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .field input, .field select, .field textarea { width: 100%; }
  .field textarea { resize: vertical; min-height: 70px; }
  .field textarea#f_notes { min-height: 120px; }
  .field input[readonly] { opacity: 0.6; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .tag-field-row { display: flex; gap: 6px; align-items: center; }
  .tag-field-row input { flex: 1; }
  .modal-actions { display: flex; justify-content: space-between; margin-top: 16px; }
  .modal-actions .right { display: flex; gap: 8px; }

  .tagpicker-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; min-height: 24px; }
  .tagpicker-chip { display: flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 5px; font-size: 12px; color: #1b1e24; font-weight: 600; }
  .tagpicker-chip .x { cursor: pointer; opacity: 0.65; font-weight: 700; }
  details.tagpicker-dropdown summary { cursor: pointer; font-size: 12px; color: var(--accent); padding: 5px 0; list-style: none; }
  details.tagpicker-dropdown summary::-webkit-details-marker { display: none; }
  .tagpicker-options { max-height: 160px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 4px; background: var(--surface-2); }
  .tagpicker-options label { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 14px; }
  .tagpicker-options label input { width: auto; padding: 0; }
  .tagpicker-add { display: flex; gap: 6px; margin-top: 6px; }
  .tagpicker-add input { flex: 1; }

  .notes-checklist { margin-top: 6px; display: none; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface-2); }
  .notes-check-row { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; padding: 4px 0; }
  .notes-check-row input { margin-top: 2px; width: auto; padding: 0; }
  .notes-check-row .struck { text-decoration: line-through; opacity: 0.55; }

  .signin-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 90vh; gap: 16px; padding: 0 24px; text-align: center; }
  .signin-screen h1 { color: var(--accent); font-size: 20px; margin: 0; }
  .signin-screen p { color: var(--muted); font-size: 13px; margin: 0; }
  .signin-screen button { padding: 12px 24px; font-size: 15px; }
</style>
<script src="theme.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div id="signinScreen" class="signin-screen">
  <h1>Планирование</h1>
  <p>Вход тем же Google-аккаунтом, которым создана таблица.</p>
  <button id="signinBtn" onclick="signIn()">Войти через Google</button>
  <p id="signinError" style="color:#c25b52"></p>
</div>

<div id="app" style="display:none">
  <header>
    <div class="header-top">
      <div>
        <a class="back" href="index.html">← К доске</a>
        <h1>Планирование</h1>
      </div>
      <button class="secondary" id="themeToggleBtn" onclick="toggleTheme()">☀️</button>
    </div>
    <div class="week-nav">
      <button class="secondary" onclick="changeWeek(-1)">◀</button>
      <span id="weekLabel"></span>
      <button class="secondary" onclick="changeWeek(1)">▶</button>
      <button class="secondary" onclick="changeWeek(0)">Эта неделя</button>
    </div>
  </header>

  <div class="tabs" id="tabs"></div>
  <main id="cardsList"></main>
  <button class="fab" onclick="openModal(null)">+</button>
</div>

<!-- модалка карточки -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2 id="modalTitle">Новая задача</h2>
    <div class="field"><label>Задача</label><textarea id="f_task"></textarea></div>

    <div class="field-row">
      <div class="field"><label>Статус</label><select id="f_status"></select></div>
      <div class="field"><label>Приоритет</label><select id="f_type"></select></div>
    </div>

    <div class="field">
      <label>Процесс</label>
      <div class="tagpicker-chips" id="tp_process_chips"></div>
      <details class="tagpicker-dropdown">
        <summary>Выбрать / изменить</summary>
        <div class="tagpicker-options" id="tp_process_options"></div>
        <div class="tagpicker-add">
          <input id="tp_process_new" placeholder="Новый процесс…">
          <button class="small" onclick="addTagInline('Проект','tp_process')">+</button>
        </div>
      </details>
    </div>
    <div class="field">
      <label>Проект</label>
      <div class="tagpicker-chips" id="tp_subprocess_chips"></div>
      <details class="tagpicker-dropdown">
        <summary>Выбрать / изменить</summary>
        <div class="tagpicker-options" id="tp_subprocess_options"></div>
        <div class="tagpicker-add">
          <input id="tp_subprocess_new" placeholder="Новый проект…">
          <button class="small" onclick="addTagInline('Подпроект','tp_subprocess')">+</button>
        </div>
      </details>
    </div>

    <div class="field-row">
      <div class="field"><label>Дата закрытия</label><input type="date" id="f_due"></div>
      <div class="field">
        <label>Актуально</label>
        <div class="tag-field-row">
          <input type="date" id="f_relevant">
          <button class="secondary small" onclick="touchRelevant()">Сегодня</button>
        </div>
      </div>
    </div>

    <div class="field-row" id="datesRow">
      <div class="field"><label>Создано</label><input id="f_created" readonly></div>
    </div>

    <div class="field">
      <label>Примечания</label>
      <textarea id="f_notes"></textarea>
      <div id="notesChecklist" class="notes-checklist"></div>
    </div>
    <div class="field"><label>№ заявки <span style="opacity:.6">(из примечаний)</span></label><input id="f_ticket" readonly></div>

    <div class="modal-actions">
      <button class="secondary" id="deleteBtn" onclick="deleteCurrent()">Удалить</button>
      <div class="right">
        <button class="secondary" onclick="closeModal()">Отмена</button>
        <button onclick="save()">Сохранить</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ================== настройки — те же, что в index.html =================== */
const CLIENT_ID = 'ВСТАВЬ_СЮДА_СВОЙ_CLIENT_ID.apps.googleusercontent.com';
const SPREADSHEET_ID = '1cqLOXudO1Dsq7ed26GezVA55LVMfjK7luaIXPuqjekw';
/* ============================================================================ */

const TASKS_SHEET = 'Tasks';
const TAGS_SHEET = 'Tags';
const SCOPES = 'https://www.googleapis.com/auth/spreadsheets';
const COLUMNS = ['id', 'Задача', 'Статус', 'Проект', 'Подпроект', 'Приоритет',
                 'Дата закрытия', 'Создано', 'Примечания', '№ заявки', 'Актуально'];
const STATUSES = ['Бэклог', 'Не начато', 'Выполняется', 'На паузе', 'Заблокировано', 'Выполнено'];
const CLOSING_STATUSES = new Set(['Выполнено', 'Заблокировано']);
const PRIORITY_COLORS = { 'Критично': '#c25b52', 'Высокий': '#d68a2b', 'Средний': '#3f7fbf', 'Низкий': '#6b7078' };
const WEEKDAY_LABELS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];

let accessToken = null;
let tasksSheetId = null;
let tagsSheetId = null;
let tasks = [];
let tags = { 'Проект': [], 'Подпроект': [] };
let selectedTags = { 'Проект': [], 'Подпроект': [] };
let editingRow = null;
let newTaskDefaultDate = null;
let weekOffset = 0;
let currentDayIndex = null; // 0..6, индекс выбранного дня в текущей неделе

/* ---------------- Google Sign-In (тот же токен, что и в index.html) ---------------- */
let tokenClient;
function saveToken(resp) {
  accessToken = resp.access_token;
  const expiresAt = Date.now() + (resp.expires_in || 3600) * 1000;
  localStorage.setItem('gToken', accessToken);
  localStorage.setItem('gTokenExpiresAt', String(expiresAt));
}
function clearToken() { localStorage.removeItem('gToken'); localStorage.removeItem('gTokenExpiresAt'); }
function hasValidStoredToken() {
  const saved = localStorage.getItem('gToken');
  const expiresAt = parseInt(localStorage.getItem('gTokenExpiresAt') || '0', 10);
  return saved && Date.now() < expiresAt ? saved : null;
}
window.onload = function () {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPES,
    callback: (resp) => {
      if (resp.error) { document.getElementById('signinError').textContent = 'Ошибка входа: ' + resp.error; return; }
      saveToken(resp);
      document.getElementById('signinScreen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      boot();
    },
  });
  const saved = hasValidStoredToken();
  if (saved) {
    accessToken = saved;
    document.getElementById('signinScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    boot();
  } else { clearToken(); }
};
function signIn() { tokenClient.requestAccessToken(); }

/* ---------------- Sheets API ---------------- */
function apiBase() { return `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}`; }
async function sheetsFetch(path, options = {}) {
  const res = await fetch(apiBase() + path, {
    ...options,
    headers: { ...(options.headers || {}), 'Authorization': `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
  });
  if (!res.ok) { const text = await res.text(); throw new Error(`Sheets API ${res.status}: ${text}`); }
  return res.json();
}
async function ensureSheetIds() {
  const meta = await sheetsFetch('?fields=sheets.properties');
  for (const s of meta.sheets) {
    if (s.properties.title === TASKS_SHEET) tasksSheetId = s.properties.sheetId;
    if (s.properties.title === TAGS_SHEET) tagsSheetId = s.properties.sheetId;
  }
  if (tagsSheetId === undefined || tagsSheetId === null) {
    const res = await sheetsFetch(':batchUpdate', { method: 'POST', body: JSON.stringify({ requests: [{ addSheet: { properties: { title: TAGS_SHEET } } }] }) });
    tagsSheetId = res.replies[0].addSheet.properties.sheetId;
    await sheetsFetch(`/values/${encodeURIComponent(TAGS_SHEET + '!A1')}?valueInputOption=USER_ENTERED`, { method: 'PUT', body: JSON.stringify({ values: [['Категория', 'Значение']] }) });
  }
}
async function fetchAllTasks() {
  const data = await sheetsFetch(`/values/${encodeURIComponent(TASKS_SHEET + '!A2:K100000')}`);
  const rows = data.values || [];
  return rows.map((row, i) => ({ row, rowIndex: i + 2 })).filter(({ row }) => row[0] && row[0].trim())
    .map(({ row, rowIndex }) => { const task = {}; COLUMNS.forEach((c, idx) => (task[c] = row[idx] || '')); task._row = rowIndex; return task; });
}
async function updateTaskRow(task) {
  const range = `${TASKS_SHEET}!A${task._row}:K${task._row}`;
  await sheetsFetch(`/values/${encodeURIComponent(range)}?valueInputOption=USER_ENTERED`, { method: 'PUT', body: JSON.stringify({ values: [COLUMNS.map((c) => task[c] || '')] }) });
}
async function appendTaskRow(task) {
  await sheetsFetch(`/values/${encodeURIComponent(TASKS_SHEET + '!A:K')}:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`, { method: 'POST', body: JSON.stringify({ values: [COLUMNS.map((c) => task[c] || '')] }) });
}
async function deleteTaskRow(rowIndex) {
  await sheetsFetch(':batchUpdate', { method: 'POST', body: JSON.stringify({ requests: [{ deleteDimension: { range: { sheetId: tasksSheetId, dimension: 'ROWS', startIndex: rowIndex - 1, endIndex: rowIndex } } }] }) });
}
async function fetchTags() {
  const data = await sheetsFetch(`/values/${encodeURIComponent(TAGS_SHEET + '!A2:B10000')}`);
  const rows = data.values || [];
  const result = { 'Проект': [], 'Подпроект': [] };
  rows.forEach((r) => { if (r[0] && result[r[0]] && r[1]) result[r[0]].push(r[1].trim()); });
  result['Проект'] = [...new Set(result['Проект'])].sort();
  result['Подпроект'] = [...new Set(result['Подпроект'])].sort();
  return result;
}
async function saveTagsFull(newTags) {
  const rows = [['Категория', 'Значение']];
  ['Проект', 'Подпроект'].forEach((cat) => newTags[cat].forEach((v) => rows.push([cat, v])));
  await sheetsFetch(`/values/${encodeURIComponent(TAGS_SHEET + '!A:B')}:clear`, { method: 'POST', body: JSON.stringify({}) });
  await sheetsFetch(`/values/${encodeURIComponent(TAGS_SHEET + '!A1')}?valueInputOption=USER_ENTERED`, { method: 'PUT', body: JSON.stringify({ values: rows }) });
}

/* ---------------- запуск ---------------- */
async function boot() {
  try {
    await ensureSheetIds();
    await reload();
  } catch (e) {
    if (e.message.includes('401') || e.message.includes('UNAUTHENTICATED')) {
      clearToken();
      document.getElementById('signinScreen').style.display = 'flex';
      document.getElementById('app').style.display = 'none';
      document.getElementById('signinError').textContent = 'Сессия истекла — войдите заново.';
    } else {
      alert('Ошибка загрузки: ' + e.message);
    }
  }
}
async function reload() {
  const [t, tg] = await Promise.all([fetchAllTasks(), fetchTags()]);
  tasks = t; tags = tg;
  document.getElementById('f_status').innerHTML = STATUSES.map((s) => `<option>${s}</option>`).join('');
  if (currentDayIndex === null) currentDayIndex = (new Date().getDay() || 7) - 1; // по умолчанию — сегодняшний день
  renderTabs();
  render();
}

/* ---------------- вспомогательные функции ---------------- */
function splitTags(v) { return (v || '').split(',').map((s) => s.trim()).filter(Boolean); }
function escapeHtml(s) { return (s || '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
function q(s) { return (s || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
function tagColor(text) {
  if (!text) return '#33383f';
  let hash = 0;
  for (let i = 0; i < text.length; i++) hash = text.charCodeAt(i) + ((hash << 5) - hash);
  return `hsl(${Math.abs(hash) % 360}, 38%, 52%)`;
}
function priorityColor(p) { return PRIORITY_COLORS[p] || '#6b7078'; }
function parseDate(dmy) { if (!dmy || !dmy.includes('.')) return null; const [d, m, y] = dmy.split('.').map(Number); return new Date(y, m - 1, d); }
function toISO(dmy) { if (!dmy || !dmy.includes('.')) return ''; const [d, m, y] = dmy.split('.'); return `${y}-${m}-${d}`; }
function toRu(iso) { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}.${m}.${y}`; }
function toRuFromDate(d) { return `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.${d.getFullYear()}`; }
function isoFromDate(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function todayISO() { return isoFromDate(new Date()); }
function sameDay(a, b) { return a && b && a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
function nextId() { const ids = tasks.map((t) => parseInt(t.id, 10)).filter((n) => !isNaN(n)); return String(ids.length ? Math.max(...ids) + 1 : 1); }

function getWeekDates(offset) {
  const now = new Date(); const day = now.getDay() || 7;
  const monday = new Date(now); monday.setHours(0, 0, 0, 0);
  monday.setDate(now.getDate() - day + 1 + offset * 7);
  return Array.from({ length: 7 }, (_, i) => { const d = new Date(monday); d.setDate(monday.getDate() + i); return d; });
}
function changeWeek(delta) { weekOffset = delta === 0 ? 0 : weekOffset + delta; renderTabs(); render(); }

function renderTabs() {
  const weekDates = getWeekDates(weekOffset);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  document.getElementById('weekLabel').textContent = `${toRuFromDate(weekDates[0])} — ${toRuFromDate(weekDates[6])}`;
  const openTasks = tasks.filter((t) => !CLOSING_STATUSES.has(t.Статус));

  document.getElementById('tabs').innerHTML = weekDates.map((date, i) => {
    const count = openTasks.filter((t) => sameDay(parseDate(t.Актуально || t.Создано), date)).length;
    const cls = ['tab']; if (i === currentDayIndex) cls.push('active'); if (sameDay(date, today)) cls.push('today');
    return `<div class="${cls.join(' ')}" onclick="selectDay(${i})">${WEEKDAY_LABELS[i]} ${date.getDate()}<span class="count">${count}</span></div>`;
  }).join('');
}
function selectDay(i) { currentDayIndex = i; renderTabs(); render(); }

function render() {
  const list = document.getElementById('cardsList');
  const weekDates = getWeekDates(weekOffset);
  const date = weekDates[currentDayIndex];
  const openTasks = tasks.filter((t) => !CLOSING_STATUSES.has(t.Статус));
  const dayTasks = openTasks
    .filter((t) => sameDay(parseDate(t.Актуально || t.Создано), date))
    .sort((a, b) => {
      const order = { 'Критично': 0, 'Высокий': 1, 'Средний': 2, 'Низкий': 3, '': 4 };
      return (order[a.Приоритет] ?? 4) - (order[b.Приоритет] ?? 4);
    });

  list.innerHTML = dayTasks.length ? dayTasks.map(cardHtml).join('') : '<div class="empty-note">на этот день ничего не запланировано</div>';
}

function cardHtml(t) {
  const tagHtml = (val) => splitTags(val).map((v) => `<span class="tag" style="background:${tagColor(v)}">${escapeHtml(v)}</span>`).join('');
  return `
    <div class="card" onclick="openModal(${t._row})">
      <div class="card-head" style="background:${priorityColor(t.Приоритет)}">
        <span>${escapeHtml(t.Приоритет || '—')}</span>
        <span>${t.Статус}</span>
      </div>
      <div class="card-body">
        <div class="task-title">${escapeHtml(t.Задача)}</div>
        <div class="meta">${tagHtml(t.Проект)}${tagHtml(t.Подпроект)}</div>
      </div>
    </div>`;
}

/* ---------------- чек-лист в примечаниях ---------------- */
const TICKET_RE = /ЗР\d{9}/;
function syncTicketFromNotes() {
  const match = document.getElementById('f_notes').value.match(TICKET_RE);
  document.getElementById('f_ticket').value = match ? match[0] : '';
}
const NUMBERED_LINE_RE = /^(\d+\.\s*)(.*)$/;
function renderNotesChecklist() {
  const container = document.getElementById('notesChecklist');
  const lines = document.getElementById('f_notes').value.split('\n');
  let html = ''; let hasList = false;
  lines.forEach((line, idx) => {
    const m = line.match(NUMBERED_LINE_RE);
    if (!m || !m[2].trim()) return;
    hasList = true;
    const strikeMatch = m[2].match(/^~~(.*)~~$/);
    const checked = !!strikeMatch;
    const text = checked ? strikeMatch[1] : m[2];
    html += `<label class="notes-check-row"><input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleNotesLine(${idx})"><span class="${checked ? 'struck' : ''}">${escapeHtml(m[1])}${escapeHtml(text)}</span></label>`;
  });
  container.innerHTML = html;
  container.style.display = hasList ? 'block' : 'none';
}
function toggleNotesLine(idx) {
  const ta = document.getElementById('f_notes');
  const lines = ta.value.split('\n');
  const m = lines[idx].match(NUMBERED_LINE_RE);
  if (!m) return;
  const strikeMatch = m[2].match(/^~~(.*)~~$/);
  lines[idx] = strikeMatch ? (m[1] + strikeMatch[1]) : (m[1] + '~~' + m[2] + '~~');
  ta.value = lines.join('\n');
  renderNotesChecklist();
}

/* ---------------- мультивыбор тегов ---------------- */
function renderTagPicker(category, prefix) {
  const chips = selectedTags[category].map((v) =>
    `<span class="tagpicker-chip" style="background:${tagColor(v)}">${escapeHtml(v)}<span class="x" onclick="removeChip('${category}','${prefix}','${q(v)}')">×</span></span>`
  ).join('') || '<span style="color:var(--muted);font-size:12px">не выбрано</span>';
  document.getElementById(`${prefix}_chips`).innerHTML = chips;
  const options = tags[category].map((v) => {
    const checked = selectedTags[category].includes(v) ? 'checked' : '';
    return `<label><input type="checkbox" ${checked} onchange="toggleTag('${category}','${prefix}','${q(v)}', this.checked)"> ${escapeHtml(v)}</label>`;
  }).join('') || '<div style="color:var(--muted);font-size:12px">тегов пока нет</div>';
  document.getElementById(`${prefix}_options`).innerHTML = options;
}
function toggleTag(category, prefix, value, checked) {
  if (checked) { if (!selectedTags[category].includes(value)) selectedTags[category].push(value); }
  else { selectedTags[category] = selectedTags[category].filter((v) => v !== value); }
  renderTagPicker(category, prefix);
}
function removeChip(category, prefix, value) {
  selectedTags[category] = selectedTags[category].filter((v) => v !== value);
  renderTagPicker(category, prefix);
}
async function addTagInline(category, prefix) {
  const input = document.getElementById(`${prefix}_new`);
  const value = input.value.trim();
  if (!value) return;
  if (!tags[category].includes(value)) { tags[category].push(value); tags[category].sort(); await saveTagsFull(tags); }
  if (!selectedTags[category].includes(value)) selectedTags[category].push(value);
  input.value = '';
  renderTagPicker(category, prefix);
}

/* ---------------- модалка карточки ---------------- */
function touchRelevant() { document.getElementById('f_relevant').value = todayISO(); }

function openModal(rowIndex) {
  editingRow = rowIndex || null;
  const t = editingRow ? tasks.find((x) => x._row === editingRow) : {};
  const weekDates = getWeekDates(weekOffset);
  newTaskDefaultDate = isoFromDate(weekDates[currentDayIndex]);

  document.getElementById('modalTitle').textContent = editingRow ? 'Задача' : 'Новая задача';
  document.getElementById('deleteBtn').style.display = editingRow ? 'inline-block' : 'none';

  document.getElementById('f_task').value = t.Задача || '';
  document.getElementById('f_status').value = t.Статус || STATUSES[1];
  selectedTags['Проект'] = splitTags(t.Проект);
  selectedTags['Подпроект'] = splitTags(t.Подпроект);
  renderTagPicker('Проект', 'tp_process');
  renderTagPicker('Подпроект', 'tp_subprocess');
  document.getElementById('f_type').innerHTML = ['Критично', 'Высокий', 'Средний', 'Низкий'].map((p) => `<option>${p}</option>`).join('');
  document.getElementById('f_type').value = t.Приоритет || 'Средний';
  document.getElementById('f_due').value = toISO(t['Дата закрытия']);
  document.getElementById('f_relevant').value = editingRow ? toISO(t.Актуально) : newTaskDefaultDate;
  document.getElementById('f_notes').value = t.Примечания || '';
  document.getElementById('f_ticket').value = t['№ заявки'] || '';
  renderNotesChecklist();

  document.getElementById('datesRow').style.display = editingRow ? 'flex' : 'none';
  document.getElementById('f_created').value = t.Создано || '';

  document.getElementById('modalBg').classList.add('open');
}
function closeModal() { document.getElementById('modalBg').classList.remove('open'); }

async function save() {
  const btn = document.querySelector('#modalBg .modal-actions .right button:last-child');
  btn.disabled = true; btn.textContent = 'Сохранение…';
  try {
    const patch = {
      'Задача': document.getElementById('f_task').value,
      'Статус': document.getElementById('f_status').value,
      'Проект': selectedTags['Проект'].join(', '),
      'Подпроект': selectedTags['Подпроект'].join(', '),
      'Приоритет': document.getElementById('f_type').value,
      'Дата закрытия': toRu(document.getElementById('f_due').value),
      'Актуально': toRu(document.getElementById('f_relevant').value),
      'Примечания': document.getElementById('f_notes').value,
      '№ заявки': document.getElementById('f_ticket').value,
    };
    if (editingRow) {
      const current = tasks.find((x) => x._row === editingRow);
      if (CLOSING_STATUSES.has(patch['Статус']) && !CLOSING_STATUSES.has(current['Статус'])) {
        if (!(patch['Дата закрытия'] || current['Дата закрытия'])) patch['Дата закрытия'] = toRuFromDate(new Date());
      }
      const merged = { ...current, ...patch, _row: editingRow };
      await updateTaskRow(merged);
    } else {
      const today = toRuFromDate(new Date());
      if (CLOSING_STATUSES.has(patch['Статус']) && !patch['Дата закрытия']) patch['Дата закрытия'] = today;
      const task = { id: nextId(), 'Создано': today, ...patch };
      if (!task['Актуально']) task['Актуально'] = newTaskDefaultDate ? toRu(newTaskDefaultDate) : today;
      await appendTaskRow(task);
    }
    closeModal();
    await reload();
  } catch (e) {
    alert('Не удалось сохранить: ' + e.message);
  }
  btn.disabled = false; btn.textContent = 'Сохранить';
}

async function deleteCurrent() {
  if (!editingRow) return;
  if (!confirm('Удалить задачу?')) return;
  try {
    await deleteTaskRow(editingRow);
    closeModal();
    await reload();
  } catch (e) {
    alert('Не удалось удалить: ' + e.message);
  }
}
</script>
