<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1b1e24">
<title>Аналитика · Трекер</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #1b1e24; --panel: #22262e; --surface-2: #1e2229; --line: #33383f;
    --text: #dcdcd6; --muted: #8a8f98; --accent: #d68a2b; --done: #4f9d69;
  }
  html.light {
    --bg: #f4f2ee; --panel: #ffffff; --surface-2: #ece8e0; --line: #ddd8ce;
    --text: #2a2a28; --muted: #726d63; --accent: #b9701f; --done: #3f8f5c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  select, input, button { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 8px 10px; font-size: 13px; font-family: inherit; }
  button { background: var(--accent); color: #1b1e24; border: none; font-weight: 600; cursor: pointer; }
  button.secondary { background: transparent; border: 1px solid var(--line); color: var(--text); font-weight: 400; }

  header { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .header-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; color: var(--accent); }
  a.back { color: var(--muted); text-decoration: none; font-size: 12px; }
  .week-nav { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .week-nav button { font-size: 12px; padding: 6px 10px; }
  #weekLabel { font-size: 12px; color: var(--muted); }

  main { padding: 14px; }
  .summary-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 18px; }
  .summary-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .summary-card .num { font-size: 22px; font-weight: 700; color: var(--accent); }
  .summary-card .label { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); margin: 0 0 12px; }

  .weekday-chart { display: flex; gap: 6px; align-items: flex-end; height: 120px; }
  .weekday-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .weekday-bar { width: 60%; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
  .weekday-count { font-size: 10px; color: var(--text); margin-bottom: 2px; }
  .weekday-label { font-size: 10px; color: var(--muted); margin-top: 5px; }

  .bar-row { display: grid; grid-template-columns: 90px 1fr 24px; align-items: center; gap: 6px; font-size: 11px; margin-bottom: 6px; }
  .bar-row .bar-label { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-row .bar-track { background: var(--surface-2); border-radius: 4px; height: 10px; overflow: hidden; }
  .bar-row .bar-fill { height: 100%; border-radius: 4px; }
  .bar-row .bar-count { color: var(--muted); text-align: right; }

  .task-row { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .task-row:last-child { border-bottom: none; }
  .task-row .title { margin-bottom: 4px; }
  .task-row .meta { display: flex; flex-wrap: wrap; gap: 5px; font-size: 10.5px; color: var(--muted); }
  .tag-chip { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10.5px; color: #1b1e24; font-weight: 600; }
  .empty-note { color: var(--muted); font-size: 13px; padding: 10px 0; text-align: center; }

  .signin-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 90vh; gap: 16px; padding: 0 24px; text-align: center; }
  .signin-screen h1 { color: var(--accent); font-size: 20px; margin: 0; }
  .signin-screen p { color: var(--muted); font-size: 13px; margin: 0; }
  .signin-screen button { padding: 12px 24px; font-size: 15px; }
</style>
<script src="theme.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div id="signinScreen" class="signin-screen">
  <h1>Аналитика</h1>
  <p>Вход тем же Google-аккаунтом, которым создана таблица.</p>
  <button id="signinBtn" onclick="signIn()">Войти через Google</button>
  <p id="signinError" style="color:var(--blocked, #c25b52)"></p>
</div>

<div id="app" style="display:none">
  <header>
    <div class="header-top">
      <div>
        <a class="back" href="index.html">← К доске</a>
        <h1>Аналитика</h1>
      </div>
      <button class="secondary" id="themeToggleBtn" onclick="toggleTheme()">☀️</button>
    </div>
    <div class="week-nav">
      <button class="secondary" onclick="changeWeek(-1)">◀</button>
      <span id="weekLabel"></span>
      <button class="secondary" onclick="changeWeek(1)">▶</button>
      <button class="secondary" onclick="changeWeek(0)">Эта неделя</button>
    </div>
  </header>

  <main>
    <div class="summary-row" id="summaryRow"></div>

    <div class="section">
      <h2>Выполнено по дням недели</h2>
      <div class="weekday-chart" id="weekdayChart"></div>
    </div>

    <div class="section">
      <h2>По процессу</h2>
      <div id="byProcess"></div>
    </div>

    <div class="section">
      <h2>По приоритету</h2>
      <div id="byPriority"></div>
    </div>

    <div class="section">
      <h2>Выполненные задачи</h2>
      <div id="tasksList"></div>
    </div>
  </main>
</div>

<script>
const CLIENT_ID = '860036772305-s13ngs4ul5fpgktgjtn7gtis3n1vlncm.apps.googleusercontent.com';
const SPREADSHEET_ID = '1cqLOXudO1Dsq7ed26GezVA55LVMfjK7luaIXPuqjekw';
const TASKS_SHEET = 'Tasks';
const SCOPES = 'https://www.googleapis.com/auth/spreadsheets';
const COLUMNS = ['id', 'Задача', 'Статус', 'Проект', 'Подпроект', 'Приоритет',
                 'Дата закрытия', 'Создано', 'Примечания', '№ заявки', 'Актуально'];
const PRIORITY_COLORS = { 'Критично': '#c25b52', 'Высокий': '#d68a2b', 'Средний': '#3f7fbf', 'Низкий': '#6b7078' };
const WEEKDAY_LABELS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];

let accessToken = null;
let allTasks = [];
let weekOffset = 0;
let tokenClient;

function saveToken(resp) {
  accessToken = resp.access_token;
  const expiresAt = Date.now() + (resp.expires_in || 3600) * 1000;
  localStorage.setItem('gToken', accessToken);
  localStorage.setItem('gTokenExpiresAt', String(expiresAt));
}
function clearToken() {
  localStorage.removeItem('gToken');
  localStorage.removeItem('gTokenExpiresAt');
}
function hasValidStoredToken() {
  const saved = localStorage.getItem('gToken');
  const expiresAt = parseInt(localStorage.getItem('gTokenExpiresAt') || '0', 10);
  return saved && Date.now() < expiresAt ? saved : null;
}

window.onload = function () {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: (resp) => {
      if (resp.error) { document.getElementById('signinError').textContent = 'Ошибка входа: ' + resp.error; return; }
      saveToken(resp);
      showApp();
    },
  });

  const saved = hasValidStoredToken();
  if (saved) { accessToken = saved; showApp(); } else { clearToken(); }
};

function signIn() { tokenClient.requestAccessToken(); }

function showApp() {
  document.getElementById('signinScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  load();
}

function apiBase() { return `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}`; }
async function sheetsFetch(path) {
  const res = await fetch(apiBase() + path, { headers: { 'Authorization': `Bearer ${accessToken}` } });
  if (!res.ok) {
    const text = await res.text();
    throw new Error(`Sheets API ${res.status}: ${text}`);
  }
  return res.json();
}

async function fetchAllTasks() {
  const data = await sheetsFetch(`/values/${encodeURIComponent(TASKS_SHEET + '!A2:K100000')}`);
  const rows = data.values || [];
  return rows.filter((r) => r[0] && r[0].trim()).map((row) => {
    const task = {};
    COLUMNS.forEach((c, idx) => (task[c] = row[idx] || ''));
    return task;
  });
}

async function load() {
  try {
    allTasks = await fetchAllTasks();
    render();
  } catch (e) {
    if (e.message.includes('401') || e.message.includes('UNAUTHENTICATED')) {
      clearToken();
      document.getElementById('signinScreen').style.display = 'flex';
      document.getElementById('app').style.display = 'none';
      document.getElementById('signinError').textContent = 'Сессия истекла — войдите заново.';
    } else {
      alert('Ошибка загрузки: ' + e.message);
    }
  }
}

function changeWeek(delta) { weekOffset = delta === 0 ? 0 : weekOffset + delta; render(); }

function splitTags(v) { return (v || '').split(',').map((s) => s.trim()).filter(Boolean); }
function escapeHtml(s) { return (s || '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
function tagColor(text) {
  if (!text) return '#33383f';
  let hash = 0;
  for (let i = 0; i < text.length; i++) hash = text.charCodeAt(i) + ((hash << 5) - hash);
  return `hsl(${Math.abs(hash) % 360}, 38%, 52%)`;
}
function parseDate(dmy) { if (!dmy || !dmy.includes('.')) return null; const [d, m, y] = dmy.split('.').map(Number); return new Date(y, m - 1, d); }
function fmtRu(d) { return `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.${d.getFullYear()}`; }
function daysBetween(from, to) { if (!from || !to) return null; return Math.round((to - from) / 86400000); }

function getWeekRange(offset) {
  const now = new Date(); const day = now.getDay() || 7;
  const monday = new Date(now); monday.setHours(0, 0, 0, 0);
  monday.setDate(now.getDate() - day + 1 + offset * 7);
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6); sunday.setHours(23, 59, 59, 999);
  return { monday, sunday };
}
function inRange(date, monday, sunday) { return date && date >= monday && date <= sunday; }

function barListHtml(counts, colorFn) {
  const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  if (!entries.length) return '<div class="empty-note">нет данных</div>';
  const max = Math.max(...entries.map((e) => e[1]));
  return entries.map(([label, count]) => `
    <div class="bar-row">
      <div class="bar-label" title="${escapeHtml(label)}">${escapeHtml(label)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(count / max * 100).toFixed(0)}%;background:${colorFn(label)}"></div></div>
      <div class="bar-count">${count}</div>
    </div>`).join('');
}

function render() {
  const { monday, sunday } = getWeekRange(weekOffset);
  document.getElementById('weekLabel').textContent = `${fmtRu(monday)} — ${fmtRu(sunday)}`;

  const completed = allTasks.filter((t) => t.Статус === 'Выполнено' && inRange(parseDate(t['Дата закрытия']), monday, sunday));
  const created = allTasks.filter((t) => inRange(parseDate(t.Создано), monday, sunday));
  const lifetimes = completed.map((t) => daysBetween(parseDate(t.Создано), parseDate(t['Дата закрытия']))).filter((d) => d !== null);
  const avgLifetime = lifetimes.length ? Math.round(lifetimes.reduce((a, b) => a + b, 0) / lifetimes.length) : null;

  document.getElementById('summaryRow').innerHTML = `
    <div class="summary-card"><div class="num">${completed.length}</div><div class="label">Выполнено</div></div>
    <div class="summary-card"><div class="num">${created.length}</div><div class="label">Создано</div></div>
    <div class="summary-card"><div class="num">${created.length ? Math.round(completed.length / created.length * 100) + '%' : '—'}</div><div class="label">Выполнено к созданному</div></div>
    <div class="summary-card"><div class="num">${avgLifetime !== null ? avgLifetime : '—'}</div><div class="label">Ср. время жизни, дней</div></div>
  `;

  const dayCounts = [0, 0, 0, 0, 0, 0, 0];
  completed.forEach((t) => { const d = parseDate(t['Дата закрытия']); if (d) dayCounts[(d.getDay() || 7) - 1]++; });
  const maxDay = Math.max(1, ...dayCounts);
  document.getElementById('weekdayChart').innerHTML = dayCounts.map((c, i) => `
    <div class="weekday-bar-wrap">
      <div class="weekday-count">${c || ''}</div>
      <div class="weekday-bar" style="height:${c ? (c / maxDay * 100) : 2}%"></div>
      <div class="weekday-label">${WEEKDAY_LABELS[i]}</div>
    </div>`).join('');

  const processCounts = {};
  completed.forEach((t) => splitTags(t.Проект).forEach((v) => (processCounts[v] = (processCounts[v] || 0) + 1)));
  document.getElementById('byProcess').innerHTML = barListHtml(processCounts, tagColor);

  const priorityCounts = {};
  completed.forEach((t) => { if (t.Приоритет) priorityCounts[t.Приоритет] = (priorityCounts[t.Приоритет] || 0) + 1; });
  document.getElementById('byPriority').innerHTML = barListHtml(priorityCounts, (p) => PRIORITY_COLORS[p] || '#6b7078');

  const sorted = [...completed].sort((a, b) => (parseDate(a['Дата закрытия']) || 0) - (parseDate(b['Дата закрытия']) || 0));
  document.getElementById('tasksList').innerHTML = sorted.length
    ? sorted.map((t) => {
        const days = daysBetween(parseDate(t.Создано), parseDate(t['Дата закрытия']));
        const tagsHtml = splitTags(t.Проект).concat(splitTags(t.Подпроект)).map((v) => `<span class="tag-chip" style="background:${tagColor(v)}">${escapeHtml(v)}</span>`).join('');
        const prioHtml = t.Приоритет ? `<span class="tag-chip" style="background:${PRIORITY_COLORS[t.Приоритет] || '#6b7078'}">${escapeHtml(t.Приоритет)}</span>` : '';
        return `<div class="task-row">
          <div class="title">${escapeHtml(t.Задача)}</div>
          <div class="meta">${t['Дата закрытия']} · ${days ?? '—'} дн. ${tagsHtml} ${prioHtml}</div>
        </div>`;
      }).join('')
    : '<div class="empty-note">за эту неделю ничего не выполнено</div>';
}
</script>
</body>
</html>
